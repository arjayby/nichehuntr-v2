name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # packages/env validates VITE_CONVEX_URL / VITE_CONVEX_SITE_URL at import time.
  # CI builds but never talks to Convex, so there is nothing real to validate against.
  SKIP_ENV_VALIDATION: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    name: build, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      # Must run before check-types: apps/web/src/routeTree.gen.ts is gitignored and
      # generated by the tanstackStart() Vite plugin. Without it the web typecheck
      # fails on 7 unresolved-route errors that say nothing about the actual change.
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run check-types

      - name: Test
        run: bun run test
